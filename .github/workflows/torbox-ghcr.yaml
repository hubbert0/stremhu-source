# A hubbert0 fork saját buildje: a `torbox` ágból Docker image-et épít
# a GitHub Container Registrybe (ghcr.io/<tulajdonos>/stremhu-source:torbox).
# Az upstream Docker Hub-os workflow-t nem érinti (az csak a main ágon fut).

name: TorBox build (GHCR)

on:
  push:
    branches:
      - torbox
    paths:
      - "client/**"
      - "server/**"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: torbox-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  server:
    name: Server
    uses: ./.github/workflows/reusable-server-test-build.yaml
    with:
      working-directory: ./server
    secrets: inherit

  client:
    name: Client
    uses: ./.github/workflows/reusable-client-test-build.yaml
    with:
      working-directory: ./client
    secrets: inherit

  build-and-push:
    name: Build & Push (GHCR)
    needs:
      - server
      - client
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stremhu-source
          tags: |
            type=raw,value=torbox
            type=sha,prefix=torbox-

      - name: Compute version
        id: version
        run: echo "value=torbox-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          # A célgép (ThinkPad T420 / Windows PC) x86-64, ezért elég az amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
