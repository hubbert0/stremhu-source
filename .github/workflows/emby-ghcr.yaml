# Az Emby-könyvtár (deploy/emby) image-e: tesztek, majd build a GitHub Container
# Registrybe (ghcr.io/<tulajdonos>/stremhu-emby:latest).

name: Emby-könyvtár build (GHCR)

on:
  push:
    branches:
      - torbox
    paths:
      - "deploy/emby/**"
      - ".github/workflows/emby-ghcr.yaml"
  workflow_dispatch:

concurrency:
  group: emby-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/emby
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Függőségek
        run: |
          pip install -r requirements.txt pytest

      - name: Pytest
        run: python -m pytest -q

  build-and-push:
    name: Build & Push (GHCR)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stremhu-emby
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/emby
          file: ./deploy/emby/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=emby
          cache-to: type=gha,mode=max,scope=emby
