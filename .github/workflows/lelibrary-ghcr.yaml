# LeLibrary (TorBox-könyvtár a Stremióban) magyar nyelvvel.
#
# A hivatalos LeLibrary legfrissebb kiadását építi meg, a deploy/lelibrary/
# patch.py módosításával (magyar nyelv, IMDb-azonosítók alapból), és feltölti:
#   ghcr.io/<tulajdonos>/lelibrary-hu:latest  és  :<verzió>-hu
# Hetente magától is lefut, így az új LeLibrary-kiadások bekerülnek.

name: LeLibrary (magyar) build (GHCR)

on:
  push:
    branches:
      - torbox
    paths:
      - "deploy/lelibrary/**"
      - ".github/workflows/lelibrary-ghcr.yaml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "LeLibrary-verzió (pl. v5.8.0); üresen a legfrissebb kiadás"
        required: false
        default: ""

concurrency:
  group: lelibrary-ghcr
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: LeLibrary-verzió
        id: ver
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            VERSION="$(git ls-remote --tags --refs https://github.com/leleasley/LeLibrary.git 'v*' \
              | sed 's#.*refs/tags/##' | sort -V | tail -1)"
          fi
          test -n "$VERSION"
          echo "LeLibrary $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: LeLibrary forrás
        uses: actions/checkout@v6
        with:
          repository: leleasley/LeLibrary
          ref: ${{ steps.ver.outputs.version }}
          path: upstream

      - name: Magyarítás
        run: python3 deploy/lelibrary/patch.py upstream

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.ghcr
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lelibrary-hu:latest
            ghcr.io/${{ github.repository_owner }}/lelibrary-hu:${{ steps.ver.outputs.version }}-hu
          labels: |
            org.opencontainers.image.title=LeLibrary (magyar)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}-hu
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=lelibrary
          cache-to: type=gha,mode=max,scope=lelibrary
