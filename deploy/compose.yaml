# StremHU + AIOStreams + StremThru + TorBox — otthoni szerverre
#
# Folyamat: Stremio → AIOStreams → StremHU (Torznab, csak keresés + .torrent)
#           → StremThru (saját, belső) → TorBox → a lejátszás közvetlenül a TorBoxról megy.
# A filmek nem érintik ezt a gépet; itt csak kis forgalmú API-hívások futnak.
#
# Kívülről ezek a címek érhetők el Tailscale Funnelen (HTTPS):
#   https://${STREMHU_HOSTNAME}.${TAILNET}     – StremHU kezelőfelület
#   https://${AIOSTREAMS_HOSTNAME}.${TAILNET}  – AIOStreams (ezt adod hozzá a Stremióhoz)
#   https://${TMDB_HOSTNAME}.${TAILNET}        – saját TMDB-addon (magyar címek)
#   https://${LELIBRARY_HOSTNAME}.${TAILNET}   – LeLibrary (TorBox-könyvtár a Stremióban)
#   https://${FELIRAT_HOSTNAME}.${TAILNET}     – magyar feliratok (feliratok.eu)
#   https://${EMBY_HOSTNAME}.${TAILNET}        – Emby-könyvtár (saját Emby-szerverek; titkos linkkel)
# A StremThru csak a belső Docker-hálózaton látszik.
#
# Szerverpult (csak a tailnetről, Funnel nélkül):
#   https://${PULT_HOSTNAME}.${TAILNET}        – kezelőfelület, széf, Docker-műveletek
#   https://${PULT_HOSTNAME}.${TAILNET}:8443   – webes terminál a szerveren
#   https://${PULT_HOSTNAME}.${TAILNET}:8090   – állapotfigyelő (Gatus)
#   https://${PULT_HOSTNAME}.${TAILNET}:9898   – mentés (Backrest)
# Az állapotfigyelő és a mentés Tailscale nélkül, SSH-alagúton is elérhető
# (a szerver saját gépén, 127.0.0.1-en; kívülről nem látszik):
#   ssh -N -L 8090:127.0.0.1:18090 -L 9898:127.0.0.1:19898 root@SZERVER
#   → http://localhost:8090 és http://localhost:9898
#
# Beállítás: deploy/README.md

name: stremhu-torbox

services:
  # ---------------------------------------------------------------- StremHU
  ts-stremhu:
    image: tailscale/tailscale:latest
    hostname: ${STREMHU_HOSTNAME:?Add meg a .env-ben}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/stremhu.json
      - TS_USERSPACE=true
    volumes:
      - ts-stremhu-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    # Opcionális: a StremHU saját torrentkliensének aktív módjához
    # (csak ha a TorBox mellett a StremHU közvetlen lejátszását is használod,
    # és a routeren továbbítod a portot erre a gépre).
    # ports:
    #   - "6881:6881"
    #   - "6881:6881/udp"
    restart: unless-stopped

  stremhu:
    image: ${STREMHU_IMAGE:-ghcr.io/hubbert0/stremhu-source:torbox}
    network_mode: service:ts-stremhu
    depends_on:
      - ts-stremhu
    environment:
      - TZ=Europe/Budapest
      # Reverse proxy mód: a StremHU sima HTTP-n figyel, a HTTPS-t a Tailscale adja.
      - REVERSE_PROXY_DOMAIN=${STREMHU_HOSTNAME}.${TAILNET:?Add meg a .env-ben}
      # Kötelező egyedi titok! Az alapértelmezett nyilvánosan ismert.
      - SESSION_SECRET=${STREMHU_SESSION_SECRET:?Futtasd az init-env.sh-t}
      # TorBox-seedkezelés: csak az nCore-torrenteket seedeli, amíg a Hit'n'Run
      # folyamatban; minden más seedelését leállítja (a fájl marad). Teli
      # helyeknél a legkevesebb hátralévő idejű nCore-seedet is leállítja, és
      # szól a telefonra, hogy máshol kell befejezni.
      # Üres kulccsal nem fut. Állapot:
      #   docker compose exec stremhu python -m app.modules.torbox_seed.status
      - TORBOX_API_KEY=${TORBOX_API_KEY:-}
      - TORBOX_CLEANUP_DRY_RUN=${TORBOX_CLEANUP_DRY_RUN:-false}
      - TORBOX_SLOT_LIMIT=${TORBOX_SLOT_LIMIT:-10}
      - TORBOX_MIN_FREE_SLOTS=${TORBOX_MIN_FREE_SLOTS:-2}
      - TORBOX_MIN_SEED_HOURS=${TORBOX_MIN_SEED_HOURS:-24}
      - TORBOX_SEED_TRACKERS=${TORBOX_SEED_TRACKERS:-ncore}
      - TORBOX_EMERGENCY_STOP=${TORBOX_EMERGENCY_STOP:-true}
      - TORBOX_NTFY_TOPIC=${NTFY_TOPIC:-}
    volumes:
      - stremhu-data:/app/data
      # Opcionális: a StremHU saját letöltései egy nagy HDD-re
      # - /mnt/hdd/stremhu-downloads:/app/data/downloads
    mem_limit: 2g
    restart: unless-stopped

  # ------------------------------------------------------------- AIOStreams
  ts-aiostreams:
    image: tailscale/tailscale:latest
    hostname: ${AIOSTREAMS_HOSTNAME:?Add meg a .env-ben}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/aiostreams.json
      - TS_USERSPACE=true
    volumes:
      - ts-aiostreams-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    network_mode: service:ts-aiostreams
    depends_on:
      - ts-aiostreams
      - stremthru
    environment:
      - TZ=Europe/Budapest
      - BASE_URL=https://${AIOSTREAMS_HOSTNAME}.${TAILNET}
      - SECRET_KEY=${AIOSTREAMS_SECRET_KEY:?Futtasd az init-env.sh-t}
      - DATABASE_URI=sqlite://./data/db.sqlite
      # Csak bejelentkezve lehet konfigurációt létrehozni (felhasznalo:jelszo).
      - AIOSTREAMS_AUTH=${AIOSTREAMS_AUTH:?Add meg a .env-ben}
      # A beépített addonok (Torznab) a saját StremThru-n át érik el a TorBoxot,
      # így az nCore passkey-t tartalmazó .torrent és a TorBox-kulcs
      # nem megy át idegen szerveren.
      - BUILTIN_STREMTHRU_URL=http://stremthru:8080
      - BUILTIN_DEBRID_USE_TORRENT_DOWNLOAD_URL=true
    volumes:
      - aiostreams-data:/app/data
    restart: unless-stopped

  # ------------------------------------------------------- TMDB-addon (magyar)
  # Saját példány a túlterhelt nyilvános szerver helyett. Beállítás és
  # telepítés: https://${TMDB_HOSTNAME}.${TAILNET}/configure
  ts-tmdb:
    image: tailscale/tailscale:latest
    hostname: ${TMDB_HOSTNAME:-tmdb}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tmdb.json
      - TS_USERSPACE=true
    volumes:
      - ts-tmdb-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  tmdb:
    image: mrcanelas/tmdb-addon:latest
    network_mode: service:ts-tmdb
    depends_on:
      - ts-tmdb
    environment:
      - PORT=1337
      - NODE_ENV=production
      - HOST_NAME=https://${TMDB_HOSTNAME:-tmdb}.${TAILNET}
      - TMDB_API=${TMDB_API_KEY:-}
      # A Fanart-kulcs opcionális (szebb logók). Kulcs nélkül az addon nem
      # indulna el, ezért helyőrzőt kap; a logók ilyenkor a TMDB-ből jönnek.
      - FANART_API=${FANART_API_KEY:-nincs}
    restart: unless-stopped

  # -------------------------------------------------------------- StremThru
  stremthru:
    image: muniftanjim/stremthru:latest
    environment:
      - STREMTHRU_BASE_URL=http://stremthru:8080
      # A stream ne ezen a gépen menjen át, hanem közvetlenül a TorBoxról.
      - STREMTHRU_STORE_CONTENT_PROXY=*:false
      # Ne ossza meg a torrent-adatokat a nyilvános StremThru példánnyal.
      - STREMTHRU_PEER_URI=-
      # Csak a TorBox-feltöltéshez szükséges részek fussanak. A nagy
      # adatbázis-szinkronok (IMDb, DMM-hashlisták) itt feleslegesek, és
      # memóriahiányhoz vezettek.
      - STREMTHRU_FEATURE=-dmm_hashlist,-imdb_title,-probe_media_info,-newz,-sync,-meta,-stremio_list,-stremio_newz,-stremio_sidekick,-stremio_store,-stremio_torz,-stremio_wrap
    volumes:
      - stremthru-data:/app/data
    restart: unless-stopped

  # ------------------------------------------- LeLibrary (TorBox-könyvtár)
  # A TorBoxon lévő filmek és sorozatok poszterekkel a Stremio kezdőlapján.
  # Beállítás: https://${LELIBRARY_HOSTNAME}.${TAILNET}/configure
  ts-lelibrary:
    image: tailscale/tailscale:latest
    hostname: ${LELIBRARY_HOSTNAME:-lelibrary}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/lelibrary.json
      - TS_USERSPACE=true
    volumes:
      - ts-lelibrary-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  lelibrary:
    image: ${LELIBRARY_IMAGE:-ghcr.io/hubbert0/lelibrary-hu:latest}
    network_mode: service:ts-lelibrary
    depends_on:
      ts-lelibrary:
        condition: service_started
      lelibrary-db:
        condition: service_healthy
      lelibrary-redis:
        condition: service_healthy
    environment:
      - TZ=Europe/Budapest
      - PORT=7860
      - BASE_URL=https://${LELIBRARY_HOSTNAME:-lelibrary}.${TAILNET}
      # A mentett beállítások titkosítása – ne változtasd meg, különben a
      # mentett beállítások olvashatatlanná válnak.
      - CONFIG_SECRET=${LELIBRARY_CONFIG_SECRET:?Futtasd az install.sh-t}
      - SELFHOST_CONFIGS_SECRET=${LELIBRARY_SELFHOST_SECRET:?Futtasd az install.sh-t}
      # A cím nyilvános, ezért a mentett beállítások listája rejtve marad.
      - SELFHOST_LIST_SETUPS=off
      - DATABASE_URL=postgres://lelibrary:${LELIBRARY_DB_PASSWORD:?Futtasd az install.sh-t}@lelibrary-db:5432/lelibrary
      - REDIS_HOST=lelibrary-redis
      - REDIS_PORT=6379
    volumes:
      - lelibrary-data:/data
    mem_limit: 1g
    restart: unless-stopped

  lelibrary-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lelibrary
      - POSTGRES_PASSWORD=${LELIBRARY_DB_PASSWORD:?Futtasd az install.sh-t}
      - POSTGRES_DB=lelibrary
    volumes:
      - lelibrary-db:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lelibrary -d lelibrary"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lelibrary-redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lfu
    volumes:
      - lelibrary-redis:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------- Magyar feliratok (feliratok.eu)
  # Stremio-felirataddon: https://${FELIRAT_HOSTNAME}.${TAILNET}/manifest.json
  ts-felirat:
    image: tailscale/tailscale:latest
    hostname: ${FELIRAT_HOSTNAME:-felirat}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/felirat.json
      - TS_USERSPACE=true
    volumes:
      - ts-felirat-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  feliratok:
    image: ${FELIRAT_IMAGE:-ghcr.io/hubbert0/stremhu-feliratok:latest}
    build: ./feliratok
    network_mode: service:ts-felirat
    depends_on:
      - ts-felirat
    environment:
      - TZ=Europe/Budapest
      - FELIRAT_BASE_URL=https://${FELIRAT_HOSTNAME:-felirat}.${TAILNET}
    volumes:
      - felirat-data:/data
    mem_limit: 256m
    restart: unless-stopped

  # --------------------------------------------------------- Emby-könyvtár
  # A saját Emby-szerverek filmjei és sorozatai a Stremio kezdőlapján, a
  # lejátszás közvetlenül az Embyről megy. Beállítás: a .env EMBY1_..., EMBY2_...
  # sorai (README 5.7). Ugyanez adja a „Mesék” sorokat is (a TMDB-addon
  # kulcsával). A telepítési link titkos (EMBY_ADDON_SECRET), kiírja:
  #   docker compose exec emby python -m app.selftest
  ts-emby:
    image: tailscale/tailscale:latest
    hostname: ${EMBY_HOSTNAME:-emby}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/emby.json
      - TS_USERSPACE=true
    volumes:
      - ts-emby-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  emby:
    image: ${EMBY_IMAGE:-ghcr.io/hubbert0/stremhu-emby:latest}
    build: ./emby
    network_mode: service:ts-emby
    depends_on:
      - ts-emby
    environment:
      - TZ=Europe/Budapest
      - EMBY_BASE_URL=https://${EMBY_HOSTNAME:-emby}.${TAILNET}
      - EMBY_ADDON_SECRET=${EMBY_ADDON_SECRET:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - EMBY1_NEV=${EMBY1_NEV:-}
      - EMBY1_URL=${EMBY1_URL:-}
      - EMBY1_FELHASZNALO=${EMBY1_FELHASZNALO:-}
      - EMBY1_JELSZO=${EMBY1_JELSZO:-}
      - EMBY2_NEV=${EMBY2_NEV:-}
      - EMBY2_URL=${EMBY2_URL:-}
      - EMBY2_FELHASZNALO=${EMBY2_FELHASZNALO:-}
      - EMBY2_JELSZO=${EMBY2_JELSZO:-}
      - EMBY3_NEV=${EMBY3_NEV:-}
      - EMBY3_URL=${EMBY3_URL:-}
      - EMBY3_FELHASZNALO=${EMBY3_FELHASZNALO:-}
      - EMBY3_JELSZO=${EMBY3_JELSZO:-}
    volumes:
      - emby-data:/data
    mem_limit: 256m
    restart: unless-stopped

  # ---------------------------------------------------------- Szerverpult
  # Csak a tailnetről érhető el (a pult.json-ban nincs Funnel), és a
  # .env-ben lévő PULT_USER / PULT_PASSWORD kell hozzá. Root jogú
  # hozzáférést ad a szerverhez, ezért SOHA ne kapcsolj rá Funnelt.
  ts-pult:
    image: tailscale/tailscale:latest
    hostname: ${PULT_HOSTNAME:-pult}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/pult.json
      - TS_USERSPACE=true
    volumes:
      - ts-pult-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    # Az állapotfigyelő és a mentés a szerver saját gépén (csak 127.0.0.1),
    # hogy SSH-alagúton Tailscale nélkül is megnyíljon. Kívülről nem érhető el.
    ports:
      - "127.0.0.1:18090:18090"
      - "127.0.0.1:19898:19898"
    restart: unless-stopped

  pult:
    image: ${PULT_IMAGE:-ghcr.io/hubbert0/stremhu-pult:latest}
    # Ha az image nem tölthető le, a szerver helyben építi meg.
    build: ./pult
    network_mode: service:ts-pult
    depends_on:
      - ts-pult
    environment:
      - TZ=Europe/Budapest
      - PULT_USER=${PULT_USER:-admin}
      - PULT_PASSWORD=${PULT_PASSWORD:?Futtasd az install.sh-t}
      - PULT_IMAGE=${PULT_IMAGE:-ghcr.io/hubbert0/stremhu-pult:latest}
      - PULT_HOSTNAME=${PULT_HOSTNAME:-pult}
      - TAILNET=${TAILNET}
      - STREMHU_HOSTNAME=${STREMHU_HOSTNAME}
      - AIOSTREAMS_HOSTNAME=${AIOSTREAMS_HOSTNAME}
      - TMDB_HOSTNAME=${TMDB_HOSTNAME:-tmdb}
      - LELIBRARY_HOSTNAME=${LELIBRARY_HOSTNAME:-lelibrary}
      - FELIRAT_HOSTNAME=${FELIRAT_HOSTNAME:-felirat}
      - EMBY_HOSTNAME=${EMBY_HOSTNAME:-emby}
      - REPO_DIR=${REPO_DIR:-/root/stremhu-source}
    volumes:
      # A konténerek kezeléséhez és a frissítéshez (git pull + compose).
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_DIR:-/root/stremhu-source}:${REPO_DIR:-/root/stremhu-source}
      # Szolgáltatáslista és a (böngészőben titkosított) széf.
      - pult-data:/data
    restart: unless-stopped

  terminal:
    image: ${PULT_IMAGE:-ghcr.io/hubbert0/stremhu-pult:latest}
    build: ./pult
    network_mode: service:ts-pult
    depends_on:
      - ts-pult
    # A webes terminál a gazdagép shelljét nyitja meg (nsenter), ehhez kell.
    pid: host
    privileged: true
    command:
      - ttyd
      - -W
      - -i
      - lo
      - -p
      - "7681"
      - -c
      - "${PULT_USER:-admin}:${PULT_PASSWORD:?Futtasd az install.sh-t}"
      - -t
      - titleFixed=Contabo
      - -t
      - fontSize=15
      - nsenter
      - -t
      - "1"
      - -m
      - -u
      - -i
      - -n
      - -p
      - --
      - /bin/bash
      - -lc
      - "cd ${REPO_DIR:-/root/stremhu-source}/deploy 2>/dev/null; exec bash -l"
    restart: unless-stopped

  # ----------------------------------------------- Állapotfigyelő (Gatus)
  # Tailneten: https://${PULT_HOSTNAME}.${TAILNET}:8090
  # SSH-alagúton: http://localhost:8090 (lásd fent)
  # Hiba esetén értesítés a telefonra (ntfy app, téma: NTFY_TOPIC a .env-ben).
  gatus:
    image: ghcr.io/twin/gatus:stable
    network_mode: service:ts-pult
    depends_on:
      - ts-pult
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
      - TAILNET=${TAILNET}
      - STREMHU_HOSTNAME=${STREMHU_HOSTNAME}
      - AIOSTREAMS_HOSTNAME=${AIOSTREAMS_HOSTNAME}
      - TMDB_HOSTNAME=${TMDB_HOSTNAME:-tmdb}
      - LELIBRARY_HOSTNAME=${LELIBRARY_HOSTNAME:-lelibrary}
      - FELIRAT_HOSTNAME=${FELIRAT_HOSTNAME:-felirat}
      - EMBY_HOSTNAME=${EMBY_HOSTNAME:-emby}
      - NTFY_TOPIC=${NTFY_TOPIC:?Futtasd az install.sh-t}
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    mem_limit: 128m
    restart: unless-stopped

  # ------------------------------------------------------ Mentés (Backrest)
  # Tailneten: https://${PULT_HOSTNAME}.${TAILNET}:9898
  # SSH-alagúton: http://localhost:9898 (lásd fent)
  # Titkosított, napi mentés egy felhőtárhelyre (beállítás: deploy/README.md).
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    network_mode: service:ts-pult
    depends_on:
      - ts-pult
    environment:
      - TZ=Europe/Budapest
      - BACKREST_PORT=0.0.0.0:19898
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    volumes:
      - backrest-data:/data
      - backrest-config:/config
      - backrest-cache:/cache
      # Az rclone beállítása (Google Drive-kapcsolat), lásd README 9. fejezet
      - backrest-rclone:/root/.config/rclone
      # Ami a mentésbe kerül (mind csak olvasható):
      - mentes-dump:/userdata/adatbazisok:ro
      - pult-data:/userdata/szerverpult:ro
      - lelibrary-data:/userdata/lelibrary:ro
      - ${REPO_DIR:-/root/stremhu-source}/deploy:/userdata/telepito:ro
      - ts-stremhu-state:/userdata/tailscale/stremhu:ro
      - ts-aiostreams-state:/userdata/tailscale/aiostreams:ro
      - ts-tmdb-state:/userdata/tailscale/tmdb:ro
      - ts-lelibrary-state:/userdata/tailscale/lelibrary:ro
      - ts-felirat-state:/userdata/tailscale/felirat:ro
      - ts-emby-state:/userdata/tailscale/emby:ro
      - ts-pult-state:/userdata/tailscale/pult:ro
    mem_limit: 512m
    restart: unless-stopped

  # Hatóránként egységes másolatot készít az adatbázisokról a mentéshez
  # (futás közben a nyers adatbázisfájl másolata sérült lehetne).
  mentes-dump:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        apk add --no-cache sqlite >/dev/null 2>&1 || echo "Figyelem: az sqlite telepítése nem sikerült"
        while true; do
          mkdir -p /dump/stremhu /dump/aiostreams
          if sqlite3 /src/stremhu/system/database/app.db ".backup '/dump/stremhu/app.db'"; then echo "StremHU-adatbázis mentve"; else echo "HIBA: StremHU-adatbázis"; fi
          if sqlite3 /src/aiostreams/db.sqlite ".backup '/dump/aiostreams/db.sqlite'"; then echo "AIOStreams-adatbázis mentve"; else echo "HIBA: AIOStreams-adatbázis"; fi
          if pg_dump -h lelibrary-db -U lelibrary lelibrary | gzip > /dump/lelibrary.sql.gz.tmp; then mv /dump/lelibrary.sql.gz.tmp /dump/lelibrary.sql.gz; echo "LeLibrary-adatbázis mentve"; else echo "HIBA: LeLibrary-adatbázis"; fi
          date '+%Y-%m-%d %H:%M' > /dump/utolso-mentes.txt
          sleep 21600
        done
    environment:
      - TZ=Europe/Budapest
      - PGPASSWORD=${LELIBRARY_DB_PASSWORD:?Futtasd az install.sh-t}
    volumes:
      - stremhu-data:/src/stremhu
      - aiostreams-data:/src/aiostreams
      - mentes-dump:/dump
    depends_on:
      lelibrary-db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  ts-stremhu-state:
  ts-aiostreams-state:
  ts-tmdb-state:
  stremhu-data:
  aiostreams-data:
  stremthru-data:
  ts-pult-state:
  pult-data:
  ts-lelibrary-state:
  lelibrary-data:
  lelibrary-db:
  lelibrary-redis:
  ts-felirat-state:
